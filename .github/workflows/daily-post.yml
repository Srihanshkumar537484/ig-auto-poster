name: Daily Instagram Auto Post

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's post image + caption
        run: python generate_post.py

      - name: Generate today's reel video
        run: python generate_reel.py

      - name: Commit generated assets (so they get a public raw URL)
        run: |
          git config user.name "ig-auto-bot"
          git config user.email "actions@github.com"
          git add assets/post.jpg assets/reel.mp4 assets/caption.txt
          git commit -m "Daily content: $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
          git push

      - name: Wait for raw.githubusercontent.com to serve the new files
        run: sleep 30

      - name: Publish to Instagram (post + reel)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_instagram.py both
